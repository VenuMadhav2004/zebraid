# Netlify config for the ZebraID frontend.
# If deploying via a connected repo, set Netlify "Base directory" to: frontend

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  VITE_API_BASE_URL = "/api"

# Forward API calls to the public FastAPI backend (no CORS needed).
# Replace BACKEND_URL with your public HTTPS backend, e.g. https://xyz.trycloudflare.com
# Rules match top-down. Versioned API keeps its /api/v1 prefix (backend serves /api/v1/*).
[[redirects]]
  from = "/api/v1/*"
  to = "https://BACKEND_URL/api/v1/:splat"
  status = 200
  force = true

# Unversioned probes: /api/health -> /health
[[redirects]]
  from = "/api/*"
  to = "https://BACKEND_URL/:splat"
  status = 200
  force = true

# SPA fallback for React Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
